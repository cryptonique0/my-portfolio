<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon Container -->
  <rect x="5" y="5" width="50" height="50" rx="8" fill="url(#logoGradient)" filter="url(#glow)"/>
  
  <!-- Document Icon -->
  <g transform="translate(15, 10)">
    <!-- Page background -->
    <rect x="0" y="0" width="30" height="40" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Page lines -->
    <line x1="5" y1="8" x2="25" y2="8" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="14" x2="25" y2="14" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="20" x2="20" y2="20" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Checkmark -->
    <path d="M 8 28 L 12 32 L 18 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="65" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white">
    On-Chain
  </text>
  <text x="65" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#06b6d4">
    Resume
  </text>
</svg>