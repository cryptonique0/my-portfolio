<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="credentialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#credentialGradient)" opacity="0.15" stroke="url(#credentialGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#credentialGradient)" filter="url(#softGlow)"/>
  
  <!-- Stacked documents -->
  <g transform="translate(30, 35)">
    <!-- Bottom document -->
    <rect x="0" y="20" width="35" height="25" rx="2" fill="white" opacity="0.7" stroke="white" stroke-width="1"/>
    <line x1="5" y1="28" x2="30" y2="28" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
    <line x1="5" y1="34" x2="25" y2="34" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Middle document -->
    <rect x="5" y="12" width="35" height="25" rx="2" fill="white" opacity="0.8" stroke="white" stroke-width="1"/>
    <line x1="10" y1="20" x2="35" y2="20" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="26" x2="30" y2="26" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Top document -->
    <rect x="10" y="4" width="35" height="25" rx="2" fill="white" opacity="0.95"/>
    <line x1="15" y1="12" x2="40" y2="12" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="15" y1="18" x2="35" y2="18" stroke="#06b6d4" stroke-width="1.5"/>
  </g>
</svg>