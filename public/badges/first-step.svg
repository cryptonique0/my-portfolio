<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="firstStepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#firstStepGradient)" opacity="0.15" stroke="url(#firstStepGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#firstStepGradient)" filter="url(#softGlow)"/>
  
  <!-- Footsteps -->
  <g transform="translate(30, 40)">
    <!-- First footprint (top) -->
    <ellipse cx="10" cy="0" rx="6" ry="8" fill="white" opacity="0.85"/>
    <circle cx="6" cy="12" r="3" fill="white" opacity="0.75"/>
    <circle cx="10" cy="14" r="3" fill="white" opacity="0.75"/>
    <circle cx="14" cy="12" r="3" fill="white" opacity="0.75"/>
    
    <!-- Second footprint (bottom right) -->
    <ellipse cx="35" cy="18" rx="6" ry="8" fill="white" opacity="0.9"/>
    <circle cx="31" cy="30" r="3" fill="white" opacity="0.8"/>
    <circle cx="35" cy="32" r="3" fill="white" opacity="0.8"/>
    <circle cx="39" cy="30" r="3" fill="white" opacity="0.8"/>
  </g>
</svg>