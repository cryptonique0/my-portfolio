<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="pioneerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#pioneerGradient)" opacity="0.15" stroke="url(#pioneerGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#pioneerGradient)" filter="url(#softGlow)"/>
  
  <!-- Rocket -->
  <g transform="translate(35, 25)">
    <!-- Rocket body -->
    <rect x="18" y="0" width="14" height="50" rx="7" fill="white" opacity="0.95"/>
    
    <!-- Window -->
    <circle cx="25" cy="10" r="4" fill="#f97316" opacity="0.8"/>
    
    <!-- Fins (left) -->
    <path d="M 18 40 L 8 50 L 15 50 Z" fill="white" opacity="0.85"/>
    
    <!-- Fins (right) -->
    <path d="M 32 40 L 42 50 L 35 50 Z" fill="white" opacity="0.85"/>
    
    <!-- Flame (bottom) -->
    <path d="M 21 50 L 18 62 L 25 55 L 32 62 L 29 50" fill="#f97316" opacity="0.8"/>
    <path d="M 23 52 L 22 60 L 25 54 L 28 60 L 27 52" fill="#fbbf24" opacity="0.7"/>
  </g>
</svg>