<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="legendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#legendGradient)" opacity="0.15" stroke="url(#legendGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#legendGradient)" filter="url(#softGlow)"/>
  
  <!-- Crown -->
  <g transform="translate(30, 30)">
    <!-- Crown base -->
    <path d="M 5 35 L 10 30 L 20 20 L 30 20 L 40 30 L 45 35 Z" fill="white" opacity="0.95" stroke="white" stroke-width="1"/>
    
    <!-- Points -->
    <circle cx="15" cy="12" r="4" fill="white" opacity="0.9"/>
    <circle cx="30" cy="8" r="5" fill="white" opacity="0.95"/>
    <circle cx="45" cy="12" r="4" fill="white" opacity="0.9"/>
    
    <!-- Jewels -->
    <circle cx="15" cy="12" r="2" fill="#d946ef" opacity="0.8"/>
    <circle cx="30" cy="8" r="2.5" fill="#a855f7" opacity="0.8"/>
    <circle cx="45" cy="12" r="2" fill="#d946ef" opacity="0.8"/>
  </g>
</svg>