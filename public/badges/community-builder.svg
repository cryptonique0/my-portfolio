<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="communityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#communityGradient)" opacity="0.15" stroke="url(#communityGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#communityGradient)" filter="url(#softGlow)"/>
  
  <!-- Connected people -->
  <g transform="translate(30, 30)">
    <!-- Left person -->
    <circle cx="8" cy="8" r="5" fill="white" opacity="0.9"/>
    <path d="M 3 15 Q 3 18 8 18 Q 13 18 13 15" fill="white" opacity="0.8"/>
    
    <!-- Center person (top) -->
    <circle cx="30" cy="2" r="5" fill="white" opacity="0.95"/>
    <path d="M 25 9 Q 25 12 30 12 Q 35 12 35 9" fill="white" opacity="0.85"/>
    
    <!-- Right person -->
    <circle cx="52" cy="8" r="5" fill="white" opacity="0.9"/>
    <path d="M 47 15 Q 47 18 52 18 Q 57 18 57 15" fill="white" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="13" y1="14" x2="25" y2="10" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="10" x2="47" y2="14" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>