<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="explorerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#explorerGradient)" opacity="0.15" stroke="url(#explorerGradient)" stroke-width="1.5"/>
  
  <!-- Main Icon Circle -->
  <circle cx="60" cy="60" r="45" fill="url(#explorerGradient)" filter="url(#softGlow)"/>
  
  <!-- Map and compass -->
  <g transform="translate(30, 30)">
    <!-- Map folded -->
    <path d="M 5 5 L 35 5 L 40 25 L 35 45 L 5 45 L 0 25 Z" fill="white" opacity="0.85" stroke="white" stroke-width="1"/>
    
    <!-- Map lines (roads/paths) -->
    <line x1="10" y1="15" x2="30" y2="15" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="25" x2="32" y2="25" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="35" x2="30" y2="35" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Compass rose (center) -->
    <circle cx="20" cy="25" r="4" fill="white" opacity="0.95"/>
    <path d="M 20 21 L 22 25 L 20 29 L 18 25 Z" fill="#8b5cf6" opacity="0.7"/>
  </g>
</svg>