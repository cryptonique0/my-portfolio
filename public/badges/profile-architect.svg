<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  <circle cx="100" cy="100" r="85" fill="white" opacity="0.1"/>
  
  <!-- Blueprint grid pattern -->
  <g stroke="white" stroke-width="1.5" opacity="0.8">
    <line x1="60" y1="70" x2="140" y2="70"/>
    <line x1="60" y1="100" x2="140" y2="100"/>
    <line x1="60" y1="130" x2="140" y2="130"/>
    <line x1="70" y1="60" x2="70" y2="140"/>
    <line x1="100" y1="60" x2="100" y2="140"/>
    <line x1="130" y1="60" x2="130" y2="140"/>
  </g>
  
  <!-- Central building/structure icon -->
  <g transform="translate(100, 100)">
    <rect x="-15" y="-20" width="10" height="30" fill="white"/>
    <rect x="5" y="-15" width="10" height="25" fill="white"/>
    <circle cx="-10" cy="15" r="5" fill="white"/>
    <circle cx="10" cy="15" r="5" fill="white"/>
  </g>
</svg>
