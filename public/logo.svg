<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient Circle -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Main Background -->
  <circle cx="100" cy="100" r="85" fill="url(#logoGradient)"/>
  
  <!-- Document/Resume Icon -->
  <g transform="translate(70, 60)">
    <!-- Document shape -->
    <rect x="0" y="0" width="60" height="85" rx="4" fill="white" opacity="0.95"/>
    
    <!-- Lines (text representation) -->
    <line x1="10" y1="15" x2="50" y2="15" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="50" y2="28" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="41" x2="50" y2="41" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Checkmark (verification) -->
    <g transform="translate(15, 55)">
      <circle cx="15" cy="10" r="12" fill="url(#accentGradient)"/>
      <path d="M 10 12 L 13 15 L 18 8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Blockchain nodes accent -->
  <g opacity="0.3">
    <circle cx="140" cy="80" r="4" fill="white"/>
    <circle cx="155" cy="100" r="4" fill="white"/>
    <circle cx="140" cy="120" r="4" fill="white"/>
    <line x1="140" y1="80" x2="155" y2="100" stroke="white" stroke-width="1.5"/>
    <line x1="155" y1="100" x2="140" y2="120" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
