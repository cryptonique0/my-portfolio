<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0080;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#cyberGrad)"/>
  <rect width="400" height="400" fill="url(#grid)"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#00FFFF" stroke-width="3" opacity="0.6"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FF00FF" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#FF0080" stroke-width="1" opacity="0.3"/>
  <text x="200" y="210" font-family="monospace" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CYBER</text>
  <text x="200" y="235" font-family="monospace" font-size="18" fill="#00FFFF" text-anchor="middle">PUNK #001</text>
  <rect x="160" y="340" width="80" height="4" fill="#00FFFF" opacity="0.8"/>
</svg>
